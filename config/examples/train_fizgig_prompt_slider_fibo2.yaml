---
# Experimental FIBO2 Dev port: replace component/data paths; actual-checkpoint VRAM fit is unverified.
job: extension
config:
  name: fibo2_fizgig_prompt_slider
  process:
    - type: fizgig_prompt_slider
      training_folder: output
      device: cuda:0
      model:
        arch: fibo2
        name_or_path: /home/bart/ComfyUI/models/diffusion_models/d/fibo2_dev_int8_convrot.safetensors
        text_encoder_path: /home/bart/ComfyUI/models/text_encoders/qwen3vl_4b_bf16.safetensors
        vae_path: /home/bart/ComfyUI/models/vae/flux2-vae.safetensors
        quantize: true
        quantize_te: false
        qtype: convrot8
        qtype_te: qfloat8
        low_vram: true
        # Optional frozen helper: assistant_lora_path (training only; omitted from exports/previews).
        # Optional preview adapter: inference_lora_path (never the training reference).
      network:
        type: lora # dora also supported (signed slider strength).
        linear: 16
        linear_alpha: 16
      fizgig_slider:
        positive_prefix: A large cat
        negative_prefix: A small cat
        cfg_negative_prefix_positive: ""
        cfg_negative_prefix_negative: ""
        prompt_entries:
          - kind: simple
            prompt: A cat sitting beside a sunny window, detailed illustration
        cfg_scale: 4
        guidance: 3
        bank_size: 16
        bank_resolution: 768
        bank_steps: 25
        preservation_weight: 1
        anchor_prompts: []
      datasets: []
      train:
        batch_size: 1
        gradient_accumulation: 1
        steps: 1000
        train_unet: true
        train_text_encoder: false
        cache_text_embeddings: false
        unload_text_encoder: true
        gradient_checkpointing: true
        noise_scheduler: flowmatch
        timestep_type: shift
        min_denoising_steps: 0
        max_denoising_steps: 999
        optimizer: adamw8bit
        lr: 0.0001
        dtype: bf16
        loss_type: mse
      save:
        save_format: safetensors
        dtype: bf16
        save_every: 250
        max_step_saves_to_keep: 4
      # Preview renderer selection does not change native practice/discovery.
      sample:
        sampler: flowmatch
        sample_every: 250
        sample_steps: 25
        width: 768
        height: 768
        guidance_scale: 4
        neg: ""
        seed: 42
        walk_seed: false
        samples:
          - prompt: A cat sitting beside a sunny window, detailed illustration
            network_multiplier: -1
          - prompt: A cat sitting beside a sunny window, detailed illustration
            network_multiplier: 0
          - prompt: A cat sitting beside a sunny window, detailed illustration
            network_multiplier: 1
meta:
  name: "[name]"
  version: "1.0"
