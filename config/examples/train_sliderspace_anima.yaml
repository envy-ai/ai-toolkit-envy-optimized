---
# Experimental port: replace component/data paths; actual-checkpoint VRAM fit is unverified.
job: extension
config:
  name: anima_sliderspace
  process:
    - type: sliderspace
      training_folder: output
      device: cuda:0
      model:
        arch: anima
        name_or_path: /path/to/anima/base
        quantize: true
        quantize_te: true
        qtype: convrotint4
        qtype_te: qfloat8
        low_vram: true
        model_kwargs:
          train_text_conditioner: false # Required for these specialized objectives.
      network:
        type: lora
        linear: 4
        linear_alpha: 4
      sliderspace:
        discovery_mode: both # generated | provided | both
        discovery_datasets:
          - folder_path: /path/to/discovery/images
            default_caption: A cat sitting beside a sunny window
        discovery_buckets: true # Native alignment: 32 pixels; area <= resolution².
        concept_prompts:
          - A cat sitting beside a sunny window
        num_directions: 4
        discovery_samples: 128 # Added to supplied images; not a combined total.
        resolution: 512
        discovery_steps: 20
        cfg_scale: 4
        negative_prompt: ""
        seed: 42
        feature_encoder: openai/clip-vit-base-patch32
        feature_device: cpu
        loss_weight: 1
        preview_direction: 1
        preview_strength: 1
      datasets: []
      train:
        batch_size: 1
        gradient_accumulation: 1
        steps: 1000 # Total across directions, not per direction.
        train_unet: true
        train_text_encoder: false
        cache_text_embeddings: false
        unload_text_encoder: true
        gradient_checkpointing: true
        noise_scheduler: flowmatch
        timestep_type: shift
        min_denoising_steps: 0
        max_denoising_steps: 999
        optimizer: adamw8bit
        lr: 0.0001
        dtype: bf16
        loss_type: mse
      save:
        save_format: safetensors
        dtype: bf16
        save_every: 250
        max_step_saves_to_keep: 4
      sample:
        sampler: flowmatch
        sample_every: 250
        sample_steps: 25
        width: 768
        height: 768
        guidance_scale: 4
        neg: ""
        seed: 42
        walk_seed: false
        samples:
          - prompt: A cat sitting beside a sunny window, detailed illustration
            network_multiplier: 1
meta:
  name: "[name]"
  version: "1.0"
