# MiniMax H3 first/last-frame FL2VA LoRA training.
---
job: extension
config:
  name: "my_minimax_h3_i2v_lora"
  process:
    - type: "sd_trainer"
      training_folder: "output"
      device: cuda:0
      network:
        type: "lora"
        linear: 16
        linear_alpha: 16
        transformer_only: true
      save:
        dtype: bfloat16
        save_every: 250
        max_step_saves_to_keep: 4
      datasets:
        - folder_path: "/path/to/video-caption-dataset"
          caption_ext: "txt"
          resolution: [512, 768]
          buckets: true
          num_frames: 124
          fps: 24
          shrink_video_to_frames: true
          do_i2v: true
          i2v_last_frame: true       # false trains first-frame-only I2V
          do_audio: true
          cache_latents_to_disk: true
          cache_text_embeddings: true
      train:
        batch_size: 1
        steps: 2000
        gradient_accumulation: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        timestep_type: "shift"
        optimizer: "adamw8bit"
        lr: 1.0e-4
        audio_loss_multiplier: 1.0
        cache_text_embeddings: true
        disable_sampling: true
        dtype: bf16
      model:
        name_or_path: "Comfy-Org/MiniMax-H3"
        arch: "minimax_h3"
        dtype: bf16
        vae_dtype: bf16
        te_dtype: bf16
        quantize: true
        qtype: convrot8
        quantize_te: true
        qtype_te: nvfp4
        low_vram: true
        model_kwargs:
          partition: fl2va
          max_text_length: 512
meta:
  name: "[name]"
  architecture: "MiniMax H3 FL2VA"
