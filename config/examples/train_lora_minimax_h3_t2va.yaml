# MiniMax H3 T2VA LoRA training (text -> video + audio).
#
# H3 training is batch-one only.  Source clips are re-timed to 24 fps and the
# frame count must be 17*k + 5; 124 frames is a useful starting point.  Keep
# sampling disabled for now and load the saved LoRA in ComfyUI for validation.
---
job: extension
config:
  name: "my_minimax_h3_t2va_lora"
  process:
    - type: "sd_trainer"
      training_folder: "output"
      device: cuda:0
      network:
        type: "lora"
        linear: 16
        linear_alpha: 16
        transformer_only: true
      save:
        dtype: bfloat16
        save_every: 250
        max_step_saves_to_keep: 4
      datasets:
        - folder_path: "/path/to/video-caption-dataset"
          caption_ext: "txt"
          resolution: [512, 768]
          buckets: true
          num_frames: 124          # 17 * 7 + 5
          fps: 24
          do_i2v: false
          do_audio: true
          cache_latents_to_disk: true
          cache_text_embeddings: true
      train:
        batch_size: 1
        steps: 2000
        gradient_accumulation: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        timestep_type: "shift"
        optimizer: "adamw8bit"
        lr: 1.0e-4
        optimizer_params:
          weight_decay: 1.0e-4
        audio_loss_multiplier: 1.0
        cache_text_embeddings: true
        disable_sampling: true
        dtype: bf16
      model:
        # Uses ComfyUI's local models folder first and downloads missing files
        # from Comfy-Org/MiniMax-H3. Component paths can be overridden with
        # model_paths or model_kwargs.*_path.
        name_or_path: "Comfy-Org/MiniMax-H3"
        arch: "minimax_h3"
        dtype: bf16
        vae_dtype: bf16
        te_dtype: bf16
        quantize: true
        qtype: convrot8
        quantize_te: true
        qtype_te: nvfp4
        low_vram: true
        model_kwargs:
          partition: fl2va
          max_text_length: 512
meta:
  name: "[name]"
  architecture: "MiniMax H3 T2VA"
