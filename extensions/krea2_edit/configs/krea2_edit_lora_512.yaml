# Krea 2 Identity Edit LoRA — 512px bulk-stage config (r64, fp8)
# Measured peak: 28.1 GB — fits 32 GB cards comfortably. For 24 GB see the README
# VRAM section (requires cache_text_embeddings: true, with its tradeoff).
#
# Launch FROM THE ai-toolkit ROOT — the config path is resolved against ai-toolkit's
# own config/ folder first and then the current directory, so it must be written
# relative to the ai-toolkit root (no env vars needed — the trainer already defaults
# to the released recipe's grounding: max 768 / jitter min 384, matching the
# inference node's grounding_px):
#   python run.py extensions/krea2_edit/configs/krea2_edit_lora_512.yaml
#
# GROUNDING_MAX_PX / GROUNDING_JITTER_MIN are OPTIONAL overrides. A higher cap, e.g.
#   GROUNDING_MAX_PX=1024 GROUNDING_JITTER_MIN=384 python run.py extensions/krea2_edit/configs/krea2_edit_lora_512.yaml
# is NOT what the released krea2-identity-edit weights trained with, and costs VRAM
# and step time.
#
# All numeric values here (steps, repeats, lr) are GENERIC STARTING POINTS —
# tune them for your dataset. See README for the dataset layout.
job: extension
config:
  name: "krea2_edit_lora"
  process:
    - type: "sd_trainer"
      training_folder: "output"
      device: cuda:0
      logging: { use_wandb: false }
      network: { type: "lora", linear: 64, linear_alpha: 64 }
      # For a 1024 finishing pass, warm-start from your best 512 checkpoint instead:
      # network: { type: "lora", linear: 64, linear_alpha: 64,
      #   pretrained_lora_path: "output/krea2_edit_lora/krea2_edit_lora_000002000.safetensors" }
      save: { dtype: float16, save_every: 250, max_step_saves_to_keep: 8 }
      datasets:
        # Single-reference edit dataset
        - folder_path: "data/my_dataset/targets"
          control_path: ["data/my_dataset/sources"]
          num_repeats: 1
          caption_ext: "txt"
          caption_dropout_rate: 0.0
          resolution: [512]          # measured 28.1 GB at r64 -> 32 GB is the sweet spot
                                     # ([768] measures 30.9 GB: still 32 GB, but tight)
          buckets: true
          cache_latents_to_disk: true
          cache_text_embeddings: false   # keeps the per-step grounding jitter (the
                                         # recipe default). Only the 24 GB tier sets
                                         # this true, trading the jitter away — and a
                                         # 2-ref dataset then also needs multi_ref.
        # Two-reference example (person-into-scene etc.) — delete if unused
        # - folder_path: "data/my_duo_dataset/targets"
        #   control_path: ["data/my_duo_dataset/sources", "data/my_duo_dataset/sources_b"]
        #   num_repeats: 1
        #   caption_ext: "txt"
        #   caption_dropout_rate: 0.0
        #   resolution: [512]
        #   buckets: true
        #   cache_latents_to_disk: true
        #   cache_text_embeddings: false
      train: { batch_size: 1, steps: 2000, gradient_accumulation: 1, train_unet: true,
        train_text_encoder: false, gradient_checkpointing: true, disable_sampling: true,
        noise_scheduler: "flowmatch", timestep_type: "weighted", optimizer: "adamw8bit",
        lr: 0.0001, lr_scheduler: "constant", dtype: bf16 }
      model: { name_or_path: "krea/Krea-2-Raw", arch: "krea2_edit",
        quantize: true, quantize_te: true,     # fp8 base + TE — assumed by every
                                               # number in the README VRAM table
        model_kwargs: { text_encoder_path: "Qwen/Qwen3-VL-4B-Instruct", fit_refs: true } }
      sample: { sample_every: 100000, samples: [] }
meta: { name: "krea2_edit_lora", version: "1.0" }
